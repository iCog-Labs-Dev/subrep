name: SubRep

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check MetaMo submodule
        run: |
          git -C external/metamo log --oneline -1
          python -c "from bridge._loader import is_available; import sys; sys.exit(0 if is_available() else 'MetaMo submodule not found: MetaMo tests would be skipped')"
      - name: Run Tests
        run: |
          pytest tests/ integration/omegaclaw/tests -v -rs
