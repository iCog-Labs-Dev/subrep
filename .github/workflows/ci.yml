name: SubRep CI

on:
  pull_request:
    branches:
      - main
      - minecraft_sim        # Phase 0-Lite exit gate: CI runs on minecraft_sim PRs
      - "refactor/*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Phase 0-Lite exit gate: feature flags must pass independently
      - name: Run feature flag tests
        run: |
          python -m pytest tests/test_feature_flags.py -v

      # Phase 4 exit gate: run pipeline in CI to generate artifacts, then test
      - name: Run Phase 4 synthetic pipeline (generates artifacts for tests)
        run: |
          python -m demo.run_village_synthetic_pipeline

      # Exclude test_env_contract.py only if Safety-Gymnasium import fails
      # (it requires Python 3.10 + safety-gymnasium; stub is provided for contract tests)
      - name: Run full test suite
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/test_safety_gymnasium_certification_ablation.py \
            --ignore=tests/test_safety_gymnasium_pareto.py \
            --ignore=tests/test_safety_gymnasium_reuse_curve.py \
            -p no:warnings