name: SubRep

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check MetaMo submodule
        run: |
          submodule_status="$(git submodule status --recursive)"
          printf '%s\n' "$submodule_status"

          if printf '%s\n' "$submodule_status" | grep -E '^[-+U]'; then
            echo "MetaMo submodule is missing, at the wrong commit, or conflicted"
            exit 1
          fi

          python -c "from bridge._loader import is_available; import sys; sys.exit(0 if is_available() else 'MetaMo submodule not found: MetaMo tests would be skipped')"
      - name: Run Tests
        env:
          SUBREP_REQUIRE_METAMO: "1"
        run: |
          pytest tests/ integration/omegaclaw/tests -v -rs
